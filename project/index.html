<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="description" content="Discover Nigerian culture, foods, festivals, and attractions.">

    <header>
        <h1>Discover Nigeria</h1>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="explore.html">Explore</a>
            <a href="contact.html">Contact</a>
            <a href="references.html">References</a>
        </nav>

    <section class="hero">
        <h2>Explore Nigeria</h2>
        <p>Experience culture, food, and beautiful places</p>
    </section>

    <main>

        <h3 id="testJS">JS Not Working</h3>

        <section>
            <h2>Popular Foods</h2>

            <div class="grid">
                <div class="card">
                    <img src="images/jollof-rice.avif" loading="lazy" alt="Jollof Rice">
                    <h3>Jollof Rice</h3>
                </div>

                <div class="card">
                    <img src="images/pounded-yam.jpg" loading="lazy" alt="Pounded yam with soup">
                    <h3>Pounded Yam</h3>
                </div>

                <div class="card">
                    <img src="images/suya.jpg" loading="lazy" alt="Grilled suya meat">
                    <h3>Suya</h3>
                </div>

                <div class="card">
                    <img src="images/moi-moi.jpg " loading="lazy" alt="Moi moi in leaf wrap ">
                    <h3>Moi Moi</h3>
                </div>

                <div class="card">
                    <img src="images/egusi.jpg " loading="lazy" alt="Egusi soup with meat ">
                    <h3>Egusi Soup</h3>
                </div>
            </div>
        </section>

        <section>
            <h2>Major Festivals</h2>
            <ul id="festivalList"></ul>

            <button id="visitBtn">Record Visit</button>
            <p id="visitMsg"></p>

            <button id="darkMode">Toggle Dark Mode</button>

            <footer>
                <p>© <span id="year"></span> | Itoro Etim Akpan | Nigeria</p>
